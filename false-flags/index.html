<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>False Flags</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #1a1e33;
    --panel-2: #232849;
    --text: #eef0fa;
    --muted: #9aa1c4;
    --accent: #ffd166;
    --good: #35c46f;
    --bad: #ef476f;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: radial-gradient(1200px 800px at 70% -10%, #232a55 0%, var(--bg) 55%);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; max-width: 720px;
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 20px 20px 4px;
  }
  h1 { font-size: 26px; margin: 0; letter-spacing: 0.5px; }
  h1 .flag-emoji { margin-right: 6px; }
  .tagline { color: var(--muted); font-size: 13px; margin: 2px 0 0; max-width: 720px; width: 100%; padding: 0 20px; }
  main { width: 100%; max-width: 720px; padding: 16px 20px 40px; }

  .flag-wrap {
    background: var(--panel); border-radius: var(--radius); padding: 18px;
    display: flex; align-items: center; justify-content: center;
    min-height: 320px; position: relative;
  }
  .flag-wrap img {
    max-width: 100%; max-height: 380px; border-radius: 6px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
  }
  .loading { text-align: center; color: var(--muted); }
  .spinner {
    width: 46px; height: 30px; margin: 0 auto 14px; border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--bad), #4cc9f0);
    background-size: 300% 100%;
    animation: wave 1.6s ease infinite;
  }
  @keyframes wave { 0%,100% { background-position: 0% 0; } 50% { background-position: 100% 0; } }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  @media (max-width: 520px) { .options { grid-template-columns: 1fr; } }
  .options button {
    padding: 15px 12px; font-size: 16px; font-weight: 600;
    background: var(--panel-2); color: var(--text);
    border: 2px solid transparent; border-radius: var(--radius); cursor: pointer;
    transition: transform 0.08s ease, border-color 0.15s ease;
  }
  .options button:hover:not(:disabled) { transform: translateY(-2px); border-color: var(--accent); }
  .options button:disabled { cursor: default; opacity: 0.85; }
  .options button.correct { background: var(--good); color: #06240f; }
  .options button.wrong { background: var(--bad); color: #33060f; }
  .options button.faded { opacity: 0.4; }

  .miss-note {
    background: var(--panel); border-left: 3px solid var(--bad);
    border-radius: 8px; padding: 10px 14px; margin-top: 10px; font-size: 15px;
    animation: slidein 0.25s ease;
  }
  .miss-note b { color: var(--bad); }
  @keyframes slidein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }

  .reveal { margin-top: 18px; animation: slidein 0.3s ease; }
  .verdict { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
  .reveal h3 { margin: 16px 0 8px; font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .factcard {
    background: var(--panel); border-radius: 10px; padding: 12px 14px; margin-top: 8px;
  }
  .factcard .fe { color: var(--accent); font-size: 13px; margin-top: 4px; }
  .decoy { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .decoy b { color: var(--text); }
  .next {
    margin-top: 22px; width: 100%; padding: 15px; font-size: 17px; font-weight: 700;
    background: var(--accent); color: #221a00; border: none; border-radius: var(--radius);
    cursor: pointer;
  }
  .next:hover { filter: brightness(1.08); }
  .error { color: var(--bad); text-align: center; padding: 20px; }
  .error button { margin-top: 10px; background: var(--panel-2); color: var(--text); border: none; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  .hidden { display: none; }
</style>
</head>
<body>
  <header>
    <h1><span class="flag-emoji">🚩</span>False Flags</h1>
  </header>
  <div class="tagline">This flag doesn't exist — but its symbols tell a true story. Which country is it for?</div>
  <main>
    <div class="flag-wrap" id="flagWrap">
      <div class="loading" id="loading">
        <div class="spinner"></div>
        <div id="loadingMsg">Stitching a brand-new flag…</div>
      </div>
    </div>

    <div class="options hidden" id="options"></div>

    <div id="missNotes"></div>

    <div class="reveal hidden" id="reveal"></div>
  </main>
<script src="app.js"></script>
</body>
</html>
